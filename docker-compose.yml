# Local infrastructure for development. Start with: docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: namma
      POSTGRES_PASSWORD: namma
      POSTGRES_DB: namma_space
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U namma -d namma_space']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
